<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PawchivePro</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --accent-fg: #ffffff;
        --border: #d1d9e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --accent: #8ab4f8;
          --accent-fg: #202124;
          --border: #5f6368;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      p {
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 8px;
      }
      button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="js/folder.js"></script>
  </body>
</html>
