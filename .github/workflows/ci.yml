name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: pawchive-pro-dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./src/manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Release notes from CHANGELOG.md and CHANGELOG.zh-TW.md
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
      - run: npm run build
      - run: cd dist && zip -r "../pawchive-pro-$GITHUB_REF_NAME.zip" .
      - uses: softprops/action-gh-release@v3
        with:
          files: pawchive-pro-*.zip
          body_path: release-notes.md
          generate_release_notes: true
